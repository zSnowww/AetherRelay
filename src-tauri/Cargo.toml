[package]
name = "aether-relay"
version = "0.2.0"
description = "Mirror Android to your desktop and play with keyboard and mouse"
authors = ["zsnow"]
license = "Apache-2.0"
repository = "https://github.com/zSnowww/AetherRelay"
homepage = "https://zsnow.dev"
edition = "2021"

[lib]
name = "aether_relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.13"
